<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP란?</title>
<style>
:root{--bg:#fffaf0;--fg:#222;--card:#fff;--accent:#d9622b;--line:#f0d9c4}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--fg:#f3eee8;--card:#272522;--accent:#ff9a62;--line:#3a3631}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:2rem;text-align:center}
section{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;margin:20px 0;text-align:center}
.big{font-size:3.5rem;letter-spacing:.2em}
p{font-size:1.25rem;margin:8px 0}
b{color:var(--accent)}
.row{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.row span.arrow{font-size:2rem;color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>🔌 MCP가 뭐야?</h1>

<section>
<div class="big">🤖❓</div>
<p>AI는 똑똑해요.<br>하지만 <b>내 파일, 내 앱</b>은 못 봐요.</p>
</section>

<section>
<div class="big">🔌</div>
<p>MCP는 AI의 <b>만능 콘센트</b>예요.<br>어디든 같은 모양으로 꽂아요.</p>
</section>

<section>
<div class="row"><span class="big">🤖</span><span class="arrow">⇄</span><span class="big">🔌</span><span class="arrow">⇄</span></div>
<div class="row"><span class="big">📁</span><span class="big">📅</span><span class="big">💬</span><span class="big">🗄️</span></div>
<p>파일 · 캘린더 · 채팅 · 데이터베이스</p>
</section>

<section>
<div class="big">🌍 → 🔌</div>
<p>예전엔 앱마다 <b>따로 연결</b>해야 했어요.<br>이제는 <b>하나의 규칙</b>이면 끝!</p>
</section>

<section>
<div class="big">🗣️ → 📅 ✅</div>
<p>"내일 일정 알려줘"<br>AI가 캘린더를 열어서 <b>진짜로</b> 알려줘요.</p>
</section>

<section>
<h2>한 줄 정리</h2>
<p><b>MCP = AI와 도구를 이어주는 USB 같은 표준 규격</b> 🎉</p>
</section>
</main>
</body>
</html>
