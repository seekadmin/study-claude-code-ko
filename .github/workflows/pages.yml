name: Deploy Website to GitHub Pages

# Korean edition: build the site and publish it to the gh-pages branch.
# Pages serves gh-pages directly ("Deploy from a branch"), which avoids the
# slow actions/deploy-pages queue.

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'scripts/build_website.py'
      - 'scripts/vendor_assets.py'
      - 'scripts/website_templates/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-gh
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache vendor assets
        uses: actions/cache@v4
        with:
          path: scripts/.vendor-cache
          key: vendor-${{ hashFiles('scripts/vendor_assets.py') }}
          restore-keys: |
            vendor-

      - name: Build website
        run: uv run scripts/build_website.py --verbose

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deploy: Korean site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
